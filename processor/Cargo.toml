[package]
name = "order-processor"
version = "0.1.0"
edition = "2021"
description = "Event-driven order processor — consumes from RabbitMQ, persists to PostgreSQL"

[dependencies]
tokio = { version = "1", features = ["full"] }
lapin = "2"
sqlx = { version = "0.7", features = ["runtime-tokio", "tls-rustls", "postgres", "uuid", "chrono", "rust_decimal"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
rust_decimal = { version = "1", features = ["serde", "serde-with-float"] }
futures-util = "0.3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
dotenvy = "0.15"
thiserror = "1"
anyhow = "1"
