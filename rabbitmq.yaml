# apiVersion: v1
# kind: Pod
# metadata:
#   name: rabbitmq
#   labels:
#     app: rabbitmq
# spec:
#   containers:
#     - name: rabbitmq
#       imagePullPolicy: IfNotPresent
#       # Never uses only the local image and fails if it is unavailable.
#       image: rabbitmq:3-management-alpine
#       ports:
#         - containerPort: 5672   # AMQP
#         - containerPort: 15672  # Management UI

apiVersion: apps/v1
kind: Deployment
metadata:
  name: rabbitmq
spec:
  replicas: 1
  selector:
    matchLabels:
      app: rabbitmq
  template:
    metadata:
      labels:
        app: rabbitmq
    spec:
      containers:
        - name: rabbitmq
          imagePullPolicy: IfNotPresent
          image: rabbitmq:3-management-alpine
          ports:
            - name: amqp
              containerPort: 5672
            - name: management
              containerPort: 15672
          livenessProbe:
            tcpSocket:
              port: amqp
            initialDelaySeconds: 30
            periodSeconds: 10
          # readinessProbe:
          #   httpGet:
          #     path: /api/healthchecks/node
          #     port: management
          #   initialDelaySeconds: 10
          #   periodSeconds: 5

---
apiVersion: v1
kind: Service
metadata:
  name: rabbitmq
spec:
  selector:
    app: rabbitmq
  ports:
    - name: amqp
      port: 5672
      targetPort: amqp
    - name: management
      port: 15672
      targetPort: management
  type: ClusterIP